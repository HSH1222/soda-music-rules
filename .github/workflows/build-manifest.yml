name: Update official rules

on:
  schedule:
    # 01:15 UTC = 09:15 China Standard Time.
    - cron: "15 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - major_label_blocklist.json
      - sources.json
      - tools/collect_official_rules.py
      - tools/build_manifest.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official rosters and build manifest
        run: python tools/collect_official_rules.py
      - name: Run collector tests
        run: python -m unittest -v test_collect_official_rules.py
      - name: Commit generated rule data
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add major_label_blocklist.json manifest.json source_snapshots.json review_queue.json
          git commit -m "Update official music rules"
          git push
